<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e56" />
      <stop offset="50%" stop-color="#ff0077" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Rounded Brand Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGrad)" filter="url(#glow)"/>
  
  <!-- Play & Sound Wave Icon -->
  <g transform="translate(10, 10)" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polygon points="10 6 32 22 10 38 10 6" fill="rgba(255, 255, 255, 0.2)"/>
    <path d="M33 16v12"/>
    <path d="M40 10v24"/>
  </g>

  <!-- Electric Cyan Pulse Accent Dot -->
  <circle cx="50" cy="14" r="5.5" fill="#00f2fe" stroke="#07090e" stroke-width="2"/>
</svg>
